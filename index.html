<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Study Tracker</h1>
  </header>
  <main>
    <section id="log-section">
      <h2>Log time</h2>
      <form id="log-form">
        <label>
          Date
          <input type="date" id="log-date" required>
        </label>
        <label>
          Minutes
          <input type="number" id="log-minutes" min="1" max="1440" step="1" required>
        </label>
        <button type="submit">Add</button>
      </form>
      <ul id="sessions"></ul>
    </section>
    <section id="heatmap-section">
      <h2>Activity</h2>
      <div class="heatmap-row">
        <div class="heatmap-days" aria-hidden="true">
          <span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span>
        </div>
        <div class="heatmap-scroll" id="heatmap-scroll">
          <div id="heatmap"></div>
        </div>
      </div>
      <div class="heatmap-legend" aria-hidden="true">
        Less
        <span class="cell level-0"></span>
        <span class="cell level-1"></span>
        <span class="cell level-2"></span>
        <span class="cell level-3"></span>
        <span class="cell level-4"></span>
        More
      </div>
    </section>
    <section id="classes-section">
      <h2>Classes</h2>
      <div id="classes"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
