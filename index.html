<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Study Tracker</h1>
  </header>
  <main>
    <section id="log-section">
      <h2>Log time</h2>
      <form id="log-form">
        <label>
          Date
          <input type="date" id="log-date" required>
        </label>
        <label>
          Minutes
          <input type="number" id="log-minutes" min="1" max="1440" step="1" required>
        </label>
        <button type="submit">Add</button>
      </form>
      <ul id="sessions"></ul>
    </section>
    <section id="heatmap-section">
      <h2>Activity</h2>
      <div id="heatmap"></div>
    </section>
    <section id="classes-section">
      <h2>Classes</h2>
      <div id="classes"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
